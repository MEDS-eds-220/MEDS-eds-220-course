# ---------------------------------------
# COURSE CALENDAR
# Events shown by {{< course-calendar >}} (home page and syllabus slides).
# `date` (and the optional `time`) are names of variables above, never dates written here.
# Each event is placed in its week and weekday column from its date.
# `type` sets the color: due (red), available (green), resubmission (orange), info or noclass (pink).

calendar-events:
  - {date: week0-thursday, label: 'Course starts', type: info}
  - {date: entry-survey-due, label: 'Entry survey due', type: due}
  - {date: hwk1-release, label: 'Hwk 1 available', type: available}
  - {date: hwk1-due, label: 'Hwk 1 due', type: due}
  - {date: hwk1-resubmission, label: 'Hwk 1 resubmission', type: resubmission}
  - {date: hwk2-release, label: 'Hwk 2 available', type: available}
  - {date: hwk2-due, label: 'Hwk 2 due', type: due}
  - {date: hwk2-resubmission, label: 'Hwk 2 resubmission', type: resubmission}
  - {date: hwk3-release, label: 'Hwk 3 available', type: available}
  - {date: hwk3-due, label: 'Hwk 3 due', type: due}
  - {date: hwk3-resubmission, label: 'Hwk 3 resubmission', type: resubmission}
  - {date: hwk4-release, label: 'Hwk 4 available', type: available}
  - {date: hwk4-due, label: 'Hwk 4 due', type: due}
  - {date: hwk4-resubmission, label: 'Hwk 4 resubmission', type: resubmission}
  - {date: final-project-instructions-available, label: 'Portfolio instructions available', type: available}
  - {date: week9-thursday, label: 'No class (Thanksgiving break)', type: noclass}
  - {date: week9-friday, label: 'No section (Thanksgiving break)', type: noclass}
  - {date: final-blog-post-due, label: 'Blog post due', type: due}
  - {date: final-repo-due, label: 'Data analysis + GH repo due', type: due}
  - {date: final-feedback-date, label: 'Portfolio feedback available', type: available}
  - {date: final-resubmission-due, time: final-resubmission-time, label: 'Portfolio final submission', type: due}
  - {date: exit-survey-due, label: 'Exit survey due', type: due}

