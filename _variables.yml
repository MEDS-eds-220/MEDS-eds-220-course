# CENTRAL COURSE VARIABLES
# Dates, deadlines, teaching team info and URLs to documents hosted outside the website.
# Update the values here once per term and re-render the full site (`quarto render`).
#
# Call a variable in any .qmd file with the shortcode {{< var variable-name >}}, e.g.
#   [Syllabus]({{< var syllabus >}})
#   This assignment is due by **11:59 pm on {{< var hwk1-due >}}**.
#
# Variables do NOT work in (update these by hand):
#   - _quarto.yml (navbar, sidebar)
#   - HTML comments <!-- -->
#   - the archived week-by-week/week-by-week-YYYY.qmd files (frozen, never edited)
#
# Write dates as 'Weekday, Month D' (e.g. 'Friday, October 2'). The course calendar
# (shortcodes/course-calendar.lua) checks that every weekday matches its date and
# warns when rendering if one doesn't.

